<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="kp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C6A0FF"/>
      <stop offset="1" stop-color="#7C4AFF"/>
    </linearGradient>
    <linearGradient id="kg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2333"/>
      <stop offset="1" stop-color="#15121B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C6A0FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C6A0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ambient glow -->
  <circle cx="100" cy="100" r="95" fill="url(#glow)"/>

  <!-- head orb -->
  <circle cx="100" cy="76" r="40" fill="url(#kg)" stroke="url(#kp)" stroke-width="2"/>

  <!-- eyes: small glowing slits -->
  <rect x="82" y="72" width="10" height="3" rx="1.5" fill="#C6A0FF"/>
  <rect x="108" y="72" width="10" height="3" rx="1.5" fill="#C6A0FF"/>

  <!-- antenna wand -->
  <line x1="100" y1="36" x2="100" y2="18" stroke="url(#kp)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="14" r="5" fill="#C6A0FF"/>
  <circle cx="100" cy="14" r="2.4" fill="#ffffff"/>

  <!-- tiny sparkles around the wand tip -->
  <g fill="#C6A0FF" opacity="0.85">
    <circle cx="112" cy="20" r="1.3"/>
    <circle cx="88" cy="24" r="1.0"/>
    <circle cx="118" cy="30" r="0.9"/>
  </g>

  <!-- body plate with code-like glyph -->
  <rect x="60" y="112" width="80" height="62" rx="14" fill="url(#kg)" stroke="url(#kp)" stroke-width="2"/>
  <g stroke="#C6A0FF" stroke-width="2.4" stroke-linecap="round" fill="none">
    <polyline points="77,134 70,143 77,152"/>
    <polyline points="123,134 130,143 123,152"/>
    <line x1="92" y1="154" x2="108" y2="134"/>
  </g>

  <!-- floor shadow -->
  <ellipse cx="100" cy="184" rx="46" ry="5" fill="#000" opacity="0.4"/>
</svg>
